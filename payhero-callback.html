<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payhero Callback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {font-family: system-ui, sans-serif;}
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-6 rounded-lg shadow-lg text-center max-w-md">
    <h1 class="text-2xl font-bold mb-4">Payment Callback Received</h1>
    <p class="mb-2">Your payment request has been sent to Payhero. The platform will now process the transaction and send a status update to this endpoint.</p>
    <p class="text-sm text-gray-600">If you see this page, the callback URL is reachable. In a real deployment the server would record the POST payload here.</p>
    <button onclick="goHome()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-500">Return to Home</button>
  </div>
  <script>
    function goHome() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
